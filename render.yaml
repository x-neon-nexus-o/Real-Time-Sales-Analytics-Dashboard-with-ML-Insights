# Render Blueprint - Infrastructure as Code
# Deploy: Connect your GitHub repo to Render and it will auto-detect this file

services:
  # ===========================================================================
  # WEB SERVICE - Main Flask Application
  # ===========================================================================
  - type: web
    name: sales-analytics-dashboard
    runtime: python
    region: oregon  # or singapore, frankfurt, ohio
    plan: free      # free, starter, standard, pro
    
    # Build settings
    buildCommand: |
      pip install -r requirements.txt
      mkdir -p logs models data/raw data/processed data/streaming
    
    # Start command using Gunicorn
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    
    # Health check endpoint
    healthCheckPath: /health
    
    # Environment variables
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure key
      - key: PORT
        value: "10000"
    
    # Auto-deploy on push to main branch
    autoDeploy: true
    
    # Disk for persistent storage (paid plans only)
    # disk:
    #   name: data-storage
    #   mountPath: /data
    #   sizeGB: 1

